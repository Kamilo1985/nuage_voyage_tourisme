<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Associe les phrases à la bonne catégorie</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#333;font:16px/1.55 Arial,sans-serif}.wrap{max-width:960px;margin:auto;padding:22px 18px}header{background:linear-gradient(110deg,#ff5b63,#ff4a55);color:white;padding:24px 28px;border-radius:17px;box-shadow:0 7px 18px #ff525725}h1{margin:0 0 5px;font-size:32px}header p{margin:0}.card{margin-top:16px;background:white;border:1px solid #e3e4e8;border-radius:17px;padding:24px;box-shadow:0 5px 15px #2221}.tabs{display:flex;gap:9px;flex-wrap:wrap}.tab,.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:bold;cursor:pointer}.tab{background:#f1f2f5;color:#333}.tab.active,.btn{background:#ff5257;color:white}.heading{display:flex;gap:12px;align-items:center}.num{background:#fff0f1;color:#ff5257;border-radius:12px;padding:10px 14px;font-weight:bold}.heading h2{margin:0}.muted{color:#717580}.hint{background:#fff6df;border-radius:10px;padding:10px 13px;margin:15px 0}.binrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bin{min-height:160px;border:2px dashed #dddfe5;border-radius:14px;background:#fafbfc;padding:12px}.bin.over{background:#fff0f1;border-color:#ff5257}.bin h3{font-size:17px;margin:0 0 10px}.bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.sentence{border:1px solid #e1e2e7;border-radius:10px;padding:10px 12px;background:white;font-weight:600;font-size:15px;cursor:grab;box-shadow:0 2px 5px #2221}.sentence.selected{outline:3px solid #ff525755;border-color:#ff5257}.bin .sentence{display:block;margin:7px 0;width:100%;text-align:left}.right{background:#e9f8f0;border-color:#45ad7c!important}.wrong{background:#fff0f0;border-color:#eb777a!important}.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:17px;flex-wrap:wrap}.result{font-weight:bold}.btn.light{background:#eff0f3;color:#444}.small{color:#717580;font-size:13px}@media(max-width:600px){.wrap{padding:12px}.binrow{grid-template-columns:1fr}header{padding:20px}h1{font-size:27px}.card{padding:18px}}
</style>
<body><div class="wrap"><header><h1>Associe les phrases à la bonne catégorie</h1><p>Lis chaque phrase et associe-la à la catégorie qui convient. Fais glisser les phrases ou touche une phrase, puis une boîte.</p></header><section class="card"><p>Choisis une activité :</p><div class="tabs"><button class="tab active" data-n="0">1. Passé composé ou futur proche ?</button><button class="tab" data-n="1">2. Auxiliaire avoir ou être ?</button></div></section><section class="card" id="game"></section></div>
<script>
const sets=[
{title:"Passé composé ou futur proche ?",desc:"Classe les phrases selon le temps utilisé.",labels:["Passé composé","Futur proche"],items:[["Nous avons visité le musée.","Passé composé"],["Je vais visiter Québec.","Futur proche"],["Léa a acheté un billet.","Passé composé"],["On va prendre l’avion demain.","Futur proche"],["Mes parents ont réservé un hôtel.","Passé composé"],["Tu vas découvrir la vieille ville.","Futur proche"],["Ils sont arrivés hier soir.","Passé composé"],["Vous allez partir vendredi.","Futur proche"]]},
{title:"Auxiliaire avoir ou auxiliaire être ?",desc:"Toutes les phrases sont au passé composé. Classe-les selon leur auxiliaire.",labels:["Auxiliaire avoir","Auxiliaire être"],items:[["J’ai visité Paris.","Auxiliaire avoir"],["Léa est allée à Montréal.","Auxiliaire être"],["Nous avons choisi un hôtel.","Auxiliaire avoir"],["Mes amis sont partis tôt.","Auxiliaire être"],["Tu as pris le train.","Auxiliaire avoir"],["Camille est arrivée lundi.","Auxiliaire être"],["Vous avez réservé une chambre.","Auxiliaire avoir"],["Les touristes sont restés trois jours.","Auxiliaire être"]]}];
let active=0,selected=null,placed=[[],[]];const game=document.getElementById("game");
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{active=+b.dataset.n;placed=[[],[]];selected=null;draw()});
function draw(){document.querySelectorAll(".tab").forEach((b,i)=>b.classList.toggle("active",i===active));let s=sets[active];game.innerHTML='<div class="heading"><div class="num">0'+(active+1)+'</div><div><h2>'+s.title+'</h2><div class="muted">'+s.desc+'</div></div></div><div class="hint"><b>Comment jouer :</b> fais glisser les phrases dans une boîte. Sur téléphone, touche une phrase puis une boîte.</div><div class="bank" id="bank"></div><div class="binrow">'+s.labels.map((l,i)=>'<div class="bin" data-bin="'+i+'"><h3>'+l+'</h3><div></div></div>').join("")+'</div><div class="controls"><span class="result" id="result"></span><div><button class="btn light" id="reset">Recommencer</button> <button class="btn" id="check">Vérifier</button></div></div><p class="small">Relis chaque phrase et observe la forme du verbe.</p>';paint();wire();document.getElementById("reset").onclick=()=>{placed=[[],[]];selected=null;draw()};document.getElementById("check").onclick=check}
function paint(){let bank=document.getElementById("bank");sets[active].items.forEach((x,i)=>{if(placed.some(a=>a.includes(i)))return;let e=document.createElement("button");e.className="sentence"+(selected===i?" selected":"");e.textContent=x[0];e.draggable=true;e.onclick=()=>{selected=i;draw()};e.ondragstart=ev=>ev.dataTransfer.setData("text/plain",i);bank.appendChild(e)})}
function wire(){document.querySelectorAll(".bin").forEach(box=>{let n=+box.dataset.bin;box.ondragover=e=>{e.preventDefault();box.classList.add("over")};box.ondragleave=()=>box.classList.remove("over");box.ondrop=e=>{e.preventDefault();box.classList.remove("over");put(+e.dataTransfer.getData("text/plain"),n)};box.onclick=e=>{if(selected!==null&&(e.target===box||e.target.tagName==="H3"||e.target===box.firstElementChild))put(selected,n)};placed[n].forEach(id=>{let el=document.createElement("button");el.className="sentence";el.textContent=sets[active].items[id][0];el.onclick=()=>{placed[n]=placed[n].filter(x=>x!==id);selected=id;draw()};box.lastElementChild.appendChild(el)})})}
function put(id,n){if(!Number.isInteger(id)||id<0)return;placed=placed.map(a=>a.filter(x=>x!==id));placed[n].push(id);selected=null;draw()}
function check(){let s=sets[active],total=placed[0].length+placed[1].length,result=document.getElementById("result");if(total<s.items.length){result.textContent="Il reste des phrases à classer.";return}let good=0;document.querySelectorAll(".bin").forEach((box,n)=>placed[n].forEach(id=>{let ok=s.items[id][1]===s.labels[n],el=[...box.querySelectorAll(".sentence")].find(x=>x.textContent===s.items[id][0]);el.classList.add(ok?"right":"wrong");if(ok)good++}));result.textContent=good===s.items.length?"Bravo ! Tout est bien classé : "+good+" / "+s.items.length+" !":good+" / "+s.items.length+" bonnes réponses. Les réponses correctes apparaissent en vert."}
draw();
</script></body></html>
